# Closes pull requests opened from forks by first-time contributors.
#
# GitHub cannot disable fork PRs on a public repository, and automated
# "contribution farm" accounts open PRs minutes after a public triage comment
# spells out a fix (#536 duplicated #535 this way). Every real change to this
# repo arrives on a same-repo branch (kolatts/*, claude/issue-*, release-please),
# which this job never touches: imagile-bot's triage and auto-fix PRs are unaffected.
# A fork PR from someone with a prior merged contribution (CONTRIBUTOR) or a
# collaborator is left alone too; only FIRST_TIMER / FIRST_TIME_CONTRIBUTOR / NONE
# are closed.
#
# pull_request_target runs on the base branch with a write token; this job never
# checks out or executes PR-head code, it only calls the API.
name: Close external PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      contains(fromJSON('["FIRST_TIMER","FIRST_TIME_CONTRIBUTOR","NONE"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Close and lock
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks, but this repository does not accept pull requests from forks. Please open an issue describing the problem instead."
          gh pr lock "$PR" --repo "$REPO" --reason off_topic
