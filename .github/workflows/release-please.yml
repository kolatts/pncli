name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to publish (e.g. v1.26.0). Blank publishes the default branch.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - name: Enable auto-merge on release PR
        if: steps.release.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.release.outputs.pull-request-number }}"

  publish:
    needs: [release-please]
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Fail fast with an actionable message. A missing or expired NPM_TOKEN
      # makes `npm publish` return E404 ("not in this registry") rather than an
      # auth error, which reads like the package was deleted. Check first.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm rejected NPM_TOKEN ($WHO). npm granular tokens expire (90 days max) - mint a new one at https://www.npmjs.com/settings/kolatts/tokens with read+write access to @kolatts/pncli and update the NPM_TOKEN secret."
            exit 1
          fi
          echo "Authenticated to npm as $WHO"

      - run: npm ci
      - run: npm run build

      # Backfilling a version older than what npm already serves (see #381) must
      # not move `latest` backwards. Publish anything older than the current
      # `latest` under a major-line tag (v1, v2) instead, which is also what
      # users pinned to that major want to resolve against.
      - name: Resolve dist-tag
        id: disttag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "@kolatts/pncli@$VERSION" version >/dev/null 2>&1; then
            echo "@kolatts/pncli@$VERSION is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          LATEST=$(npm view @kolatts/pncli version 2>/dev/null || echo '0.0.0')
          NEWEST=$( { echo "$VERSION"; echo "$LATEST"; } | sort -V | tail -1 )
          if [[ "$VERSION" == "$LATEST" || "$NEWEST" == "$VERSION" ]]; then
            TAG=latest
          else
            TAG="v${VERSION%%.*}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$TAG' (npm latest is $LATEST)"

      - name: Publish to npm
        if: steps.disttag.outputs.skip == 'false'
        run: npm publish --access=public --provenance --tag "${{ steps.disttag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Discord
        if: needs.release-please.outputs.release_created == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_URL="https://github.com/${REPO}/releases/tag/v${VERSION}"
          NPM_URL="https://www.npmjs.com/package/@kolatts/pncli/v/${VERSION}"
          jq -n \
            --arg title "@kolatts/pncli v${VERSION} published" \
            --arg url "$RELEASE_URL" \
            --arg desc "[Release notes](${RELEASE_URL}) · [npm](${NPM_URL})" \
            --argjson color 16750848 \
            '{"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"

      # The 1.26.0 publish failed silently on 2026-08-24 and nobody noticed until
      # 2.0.0 failed the same way three days later. Shout when publishing breaks.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)
          jq -n \
            --arg title "@kolatts/pncli v${VERSION} FAILED to publish" \
            --arg url "$RUN_URL" \
            --arg desc "The publish job failed. [View the run](${RUN_URL}) - npm still serves the previous version." \
            --argjson color 15158332 \
            '{"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"
