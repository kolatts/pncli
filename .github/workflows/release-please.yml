name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - name: Enable auto-merge on release PR
        if: steps.release.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.release.outputs.pull-request-number }}"

  publish:
    needs: [release-please]
    if: |
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          NPM_URL="https://www.npmjs.com/package/@kolatts/pncli/v/${VERSION}"
          jq -n \
            --arg title "@kolatts/pncli v${VERSION} published" \
            --arg url "$RELEASE_URL" \
            --arg desc "[Release notes](${RELEASE_URL}) · [npm](${NPM_URL})" \
            --argjson color 16750848 \
            '{"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
