name: Claude Review

# Reviews are submitted with the workflow's own GITHUB_TOKEN, so they are
# authored by github-actions[bot]. Two consequences shape this file:
#
# 1. github-actions[bot] is never the PR author (triage PRs belong to
#    imagile-bot[bot], human PRs to their humans), so formal APPROVE /
#    REQUEST_CHANGES reviews are possible on every PR. The Claude app token
#    used previously could not submit formal reviews at all — reviews fell
#    back to plain comments (see PR #392).
#
# 2. Events raised by the default GITHUB_TOKEN do not trigger other workflows,
#    so a CHANGES_REQUESTED review from this job will NOT fire
#    claude-pr-feedback.yml's `pull_request_review` trigger. The "Trigger
#    feedback loop" step below closes that gap by dispatching the feedback
#    workflow explicitly. Remove that step and the review loop goes dead.
#
# APPROVE additionally requires the repo setting "Allow GitHub Actions to
# create and approve pull requests" (Settings → Actions → General → Workflow
# permissions). REQUEST_CHANGES is not gated by it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip forks and third-party bots. Allow human-authored PRs plus PRs created
    # by Imagile Bot through our triage workflow on claude/issue-* branches.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      (
        !endsWith(github.event.pull_request.user.login, '[bot]') ||
        github.event.pull_request.user.login == 'claude[bot]' ||
        (
          github.event.pull_request.user.login == 'imagile-bot[bot]' &&
          startsWith(github.event.pull_request.head.ref, 'claude/issue-')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      # `actions: write` is for the feedback-loop dispatch step, not the agent:
      # the agent's allowedTools contain no `gh workflow` commands, so the wider
      # scope on its token is not reachable through the tool allowlist.
      actions: write
      contents: read
      # `issues: write` covers deleting previous rounds' tracking comments
      # (PR conversation comments live on the issues API).
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The reviewer can run the same gate CI runs (#508). Without this it reviewed
      # regexes by reading them, asked the author to "confirm CI is green", and
      # each guess cost a round.
      #
      # Trade-off, accepted: `npm ci` here runs the PR head's lifecycle scripts
      # (it already did in the feedback workflow), and `npm test` inside the
      # Claude step runs PR test code with the OAuth token and github.token in
      # the process env. The `head.repo.fork == false` guard above scopes that to
      # same-repo heads — people with push access, triage's own branches, and the
      # feedback agent — so it is the same trust we already extend to the feedback
      # loop. A PR whose install fails gets no review until that is fixed; the
      # failed job says so.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token, always: it can submit formal reviews on every PR
          # (see header). This also removes the old workflow-changed fallback —
          # nothing here is validated against the default branch anymore.
          github_token: ${{ github.token }}
          # github-actions[bot]'s global account id; comments and reviews from
          # the workflow token are authored by this identity.
          bot_id: 41898282
          bot_name: github-actions[bot]
          allowed_bots: 'imagile-bot'
          track_progress: true
          classify_inline_comments: 'true'
          include_fix_links: 'true'
          plugin_marketplaces: |
            https://github.com/kolatts/claude-marketplace.git
          plugins: |
            sunny
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            REVIEW ACTOR: github-actions[bot]

            **Before doing anything else, read and clean up stale Claude feedback:**
            1. Fetch all previous review comments on this PR and read them to retain context:
               gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | {id: .id, body: .body}'
            2. Note any issues or concerns raised in those previous comments — you will carry this context into your review.
            3. Delete each previous comment by ID:
               gh api repos/${{ github.repository }}/issues/comments/<id> -X DELETE
               (repeat for every ID returned in step 1)
               EXCEPTIONS — never delete:
               - the tracking comment for THIS run (the one you update via update_claude_comment)
               - any comment containing "claude-pr-feedback-round" (round-limit markers used by the feedback workflow)
            4. Dismiss any previous formal review from github-actions[bot] on this PR. List them with:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[] | select(.user.login == "github-actions[bot]" and (.state == "APPROVED" or .state == "CHANGES_REQUESTED")) | .id'
               and dismiss each with:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/<id>/dismissals -X PUT -f message="Superseded by a newer automated review"
            5. Best effort only: try to resolve outdated inline review comment threads from previous reviews with `gh api graphql` (resolveReviewThread mutation). The workflow token is often refused on that mutation; if it fails, move on without reporting it as a problem.

            **Now review the pull request:**

            Review this pull request for the @kolatts/pncli repository.
            Focus on:
            1. Code quality and correctness (TypeScript CLI in src/, C# Azure Functions in functions/)
            2. CLI UX (commander/inquirer usage, error messages, exit codes)
            3. Security (command injection, credential handling, prompt injection, auth gaps)
            4. Bugs and edge cases
            5. Adherence to existing patterns in the codebase

            Leave inline comments on specific lines and a top-level summary.
            Skip nitpicks; prioritize substantive feedback.

            **Run, don't guess.** Dependencies are installed. Before claiming that an
            input slips past a regex, a parser, or a config resolver, run it: `npm test`,
            or `npx vitest run <file>` for one suite, and `npm run typecheck` / `npm run
            lint` when the change could affect them. A finding backed by a failing input
            you actually ran is worth a round; one that starts "I couldn't run vitest"
            usually costs one. Do not ask the author to confirm CI is green — the CI
            checks on the PR already say so.

            **When you are done, submit a formal GitHub review.** Prefer the MCP tool
            `mcp__github__create_and_submit_pull_request_review` (owner/repo/pullNumber from
            the header above) with event `APPROVE` if no substantive issues were found, or
            `REQUEST_CHANGES` if there are blocking problems. `gh pr review ${{ github.event.pull_request.number }} --approve|--request-changes --body "..."`
            is the fallback if the MCP tool is unavailable.

            Do not leave a PR without a formal APPROVE or REQUEST_CHANGES state.

            **Do the whole review yourself, in this session.** This runs headless: the
            moment you end your turn the process exits, and anything still running in the
            background is killed with it. Do not delegate to subagents, do not start
            background work, and never end your turn with a promise to post findings
            "shortly" — submitting the formal review is the last thing you do, and nothing
            may come after it. Read the diff and the changed files directly (`gh pr diff`,
            `git diff origin/main...HEAD`, the Read/Grep tools). On a large PR, review the
            highest-risk files first rather than skipping the review.
          # Bash rule shapes matter here. Claude Code only treats `:*` as a
          # wildcard on an otherwise-literal prefix: a `*` earlier in the rule
          # combined with a `:*` suffix never matches anything (verified on
          # 2.1.258/2.1.261 — every `gh api repos/...` call was denied with "This
          # command requires approval" while `gh pr view:*` worked). Rules with a
          # mid-pattern `*` must use the trailing-space form (`... *`) instead.
          # The `gh api` rules stay scoped to issues/pulls endpoints so the
          # token's `actions: write` scope is still unreachable from the agent.
          #
          # `git diff/log/show` are read-only and were the source of most of the
          # ~22 permission denials per run: the agent's first move is gathering the
          # diff against origin/main.
          #
          # Agent/Task are disallowed on purpose. Runs on large PRs dispatched
          # background subagents and then ended the turn to "wait" for them; in
          # headless mode that exits the process, kills the subagents, and the
          # formal review is never submitted — the job still reads green (#500).
          claude_args: |
            --model claude-opus-5-5 --disallowedTools "Agent,Task" --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(npm run typecheck:*),Bash(npm run lint:*),Bash(npm test:*),Bash(npx vitest run:*),mcp__github__get_issue_comments,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_diff,mcp__github__create_and_submit_pull_request_review,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__add_issue_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api graphql *),Bash(gh api repos/*/issues/*/comments *),Bash(gh api repos/*/issues/comments/* *),Bash(gh api repos/*/pulls/*/reviews *),Bash(gh api repos/*/pulls/*/reviews/*/dismissals *),Bash(gh api repos/*/pulls/*/comments *)"

      # The agent can end "successfully" without ever submitting a review (see
      # #500). Check for one on this run's head commit and fail loudly instead of
      # letting a missing review read as a green check. Skipped when the agent
      # step itself failed or was cancelled (a newer push supersedes this run).
      - name: Verify a formal review was submitted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            > /tmp/verify-reviews.json
          # shellcheck disable=SC2016
          jq -r --arg sha "${HEAD_SHA}" \
            '.[] | select(.user.login == "github-actions[bot]"
                          and .commit_id == $sha
                          and (.state == "APPROVED" or .state == "CHANGES_REQUESTED")) | .id' \
            /tmp/verify-reviews.json > /tmp/verify-ids.txt
          if ! grep -q . /tmp/verify-ids.txt; then
            echo "::error::The review agent finished without submitting an APPROVE or REQUEST_CHANGES review for ${HEAD_SHA}. Re-run this job, or push a new commit."
            exit 1
          fi
          echo "Formal review found for ${HEAD_SHA}"

      # Reviews from the default GITHUB_TOKEN raise no workflow events, so the
      # feedback loop must be kicked explicitly (see header). Deterministic step
      # rather than a prompt instruction: the agent's token stays unable to
      # dispatch workflows via the tool allowlist, and a forgotten instruction
      # cannot silently kill the loop.
      - name: Trigger feedback loop on CHANGES_REQUESTED
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Scoped to reviews on THIS run's head commit: after the feedback
          # workflow pushes, earlier CHANGES_REQUESTED reviews keep their old
          # commit_id, so stale rounds can never re-trigger the loop. State is
          # matched exactly — a dismissed review reads DISMISSED, not
          # CHANGES_REQUESTED.
          #
          # Fetched to a file first (a failed fetch fails the step instead of
          # silently reading as "no reviews"), then filtered with jq proper so
          # HEAD_SHA binds via --arg. Ids + `grep -c`, not `[...] | length`:
          # --paginate emits one JSON document per page, so a single `length`
          # would print one count per page on review-heavy PRs.
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            > /tmp/reviews-raw.json
          # shellcheck disable=SC2016
          jq -r --arg sha "${HEAD_SHA}" \
            '.[] | select(.user.login == "github-actions[bot]"
                          and .commit_id == $sha
                          and .state == "CHANGES_REQUESTED") | .id' \
            /tmp/reviews-raw.json > /tmp/cr-reviews.txt
          COUNT=$(grep -c . /tmp/cr-reviews.txt || true)
          if [ "${COUNT}" -gt 0 ]; then
            echo "CHANGES_REQUESTED review found on ${HEAD_SHA} — dispatching claude-pr-feedback"
            # `gh workflow run` dispatches the DEFAULT-BRANCH version of the
            # target workflow. Until the review_commit input has merged to main,
            # passing it returns HTTP 422 — so fall back to pr_number alone
            # rather than letting a green review read as a red run. The fallback
            # loses only the stale-review gate for that round.
            gh workflow run claude-pr-feedback.yml \
              --repo "${{ github.repository }}" \
              -f pr_number="${PR_NUMBER}" \
              -f review_commit="${HEAD_SHA}" || {
              echo "::warning::Dispatch with review_commit failed (input not on default branch yet?); retrying without it"
              gh workflow run claude-pr-feedback.yml \
                --repo "${{ github.repository }}" \
                -f pr_number="${PR_NUMBER}"
            }
          else
            echo "No CHANGES_REQUESTED review on ${HEAD_SHA}; nothing to dispatch"
          fi
