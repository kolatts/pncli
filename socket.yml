version: 2
settings:
  issueRules:
    # TLS verification is on by default; PNCLI_INSECURE_TLS=1 is an explicit,
    # warned opt-out for SSL-inspection proxies (see src/cli.ts).
    envSet:
      action: ignore
    # pncli embeds base URLs only for public API endpoints listed below.
    # All service hosts (Jira, Bitbucket, Contrast, etc.) are user-supplied
    # at runtime via PNCLI_*_BASE_URL env vars or `pncli config set` — none
    # are hardcoded in the binary.
    # Approved hardcoded endpoints:
    #   - https://api.osv.dev            (OSV vulnerability database)
    #   - https://ossindex.sonatype.org  (Sonatype OSS Index)
    # Any new hardcoded URL added to this package must be reviewed here.
    urlStrings:
      action: ignore
